# ==============================================================================
# HẠ TẦNG APACHE FLINK (STREAM PROCESSING CLUSTER)
# Dự án: E-Commerce Real-Time Purchase Propensity Prediction System
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. FLINK JOBMANAGER (Master Node / Bộ não điều phối)
  # - Lập lịch thực thi các Streaming Job (Job Scheduling)
  # - Quản lý Checkpoint / Savepoint đảm bảo tính toàn vẹn dữ liệu (Exactly-Once)
  # - Cung cấp Flink Web Dashboard (cổng 8081) theo dõi Metrics, Backpressure
  # ----------------------------------------------------------------------------
  flink-jobmanager:
    image: apache/flink:1.17.1-scala_2.12-java11
    container_name: ecom_flink_jobmanager
    restart: unless-stopped
    ports:
      # Ánh xạ Web Dashboard ra máy host: http://localhost:8081
      - "${FLINK_REST_PORT:-8081}:8081"
    command: jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        # Địa chỉ mạng nội bộ để TaskManager liên lạc với Master
        jobmanager.rpc.address: flink-jobmanager
        # Mức độ song song mặc định (Baseline chạy 1 luồng để quan sát bottleneck)
        parallelism.default: 1
        # Cổng mở REST API phục vụ cho giao diện Web UI
        rest.port: 8081
        
        # --- CẤU HÌNH KẾT NỐI MINIO S3 (CHECKPOINT & FILE STORAGE) ---
        s3.endpoint: ${MINIO_INTERNAL_ENDPOINT:-http://minio:9000}
        s3.path.style.access: true
        s3.access-key: ${MINIO_ACCESS_KEY:-minioadmin}
        s3.secret-key: ${MINIO_SECRET_KEY:-minioadmin}
        s3.ssl.enabled: false
        s3.region: us-east-1
        fs.s3a.endpoint.region: us-east-1
    networks:
      - default
    volumes:
      - flink_data:/tmp/flink
      # Plugin hệ thống (chứa driver S3 MinIO: flink_plugins/s3-fs-hadoop/)
      - ./flink_plugins:/opt/flink/plugins
      # Thư mục chứa thư viện mở rộng (chứa driver Kafka: flink_jars/)
      - ./flink_jars:/opt/flink/usrlib

  # ----------------------------------------------------------------------------
  # 2. FLINK TASKMANAGER (Worker Node / Công nhân thực thi)
  # - Nhận các task nhỏ từ JobManager và phân bổ vào 4 Task Slots để xử lý
  # - Lưu trữ bộ nhớ trạng thái (State) của Deduplication và Window Aggregations
  # - Ghi dữ liệu trực tiếp vào MinIO S3 hoặc đẩy sang Redis
  # ----------------------------------------------------------------------------
  flink-taskmanager:
    image: apache/flink:1.17.1-scala_2.12-java11
    container_name: ecom_flink_taskmanager
    restart: unless-stopped
    depends_on:
      - flink-jobmanager
    command: taskmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        # Cung cấp 4 task slots (đủ để chạy song song 3 partition của Kafka topic)
        taskmanager.numberOfTaskSlots: 4
        parallelism.default: 1
        
        # --- CẤU HÌNH KẾT NỐI MINIO S3 (ĐỂ WORKER GHI DỮ LIỆU) ---
        s3.endpoint: ${MINIO_INTERNAL_ENDPOINT:-http://minio:9000}
        s3.path.style.access: true
        s3.access-key: ${MINIO_ACCESS_KEY:-minioadmin}
        s3.secret-key: ${MINIO_SECRET_KEY:-minioadmin}
        s3.ssl.enabled: false
        s3.region: us-east-1
        fs.s3a.endpoint.region: us-east-1
    networks:
      - default
    volumes:
      - flink_data:/tmp/flink
      - ./flink_plugins:/opt/flink/plugins
      - ./flink_jars:/opt/flink/usrlib

# ==============================================================================
# VOLUME & NETWORK NỘI BỘ
# ==============================================================================
volumes:
  flink_data:

networks:
  default:
    # Nối Flink vào chung mạng 'docker_default' với Kafka và MinIO
    name: docker_default
    external: true
