version: '3.8'

services:
  minio:
    # Image chính thức từ Quay.io của MinIO (tránh lỗi 404 và rate limit của Docker Hub)
    image: quay.io/minio/minio:latest
    
    # Tên định danh của container khi chạy (quản lý qua docker ps)
    container_name: ecom_minio
    
    # Tự động khởi động lại nếu container bị crash đột ngột hoặc máy tính khởi động lại
    restart: unless-stopped
    
    # Ánh xạ cổng mạng: [Cổng máy thật (Host)] : [Cổng bên trong Container]
    ports:
      - "${MINIO_PORT:-9000}:9000"  # Cổng S3 API: Code Python (boto3), PySpark, Trino, Flink kết nối vào đây
      - "${MINIO_CONSOLE_PORT:-9001}:9001"  # Cổng Web Console: Mở trình duyệt truy cập http://localhost:9001
      
    # Thiết lập biến môi trường cho tài khoản quản trị cấp cao nhất (Root Admin)
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}      # Tên đăng nhập
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}  # Mật khẩu đăng nhập
      
    # Lệnh khởi động MinIO:
    # - "server /data": chạy chế độ máy chủ và lưu trữ file vào thư mục /data trong container
    # - "--console-address :9001": cố định cổng Web Console ở cổng 9001 (không bị sinh cổng ngẫu nhiên)
    command: server /data --console-address ":9001"
    
    # Gắn ổ đĩa lưu trữ bền vững (Persistent Volume)
    # Cú pháp: [Tên volume trên máy thật (Host)] : [Thư mục bên trong Container]
    # Giúp dữ liệu không bị mất khi tắt hoặc xóa container
    volumes:
      - minio_data:/data

# Khai báo volume do Docker quản lý trên ổ cứng máy thật
volumes:
  minio_data:
