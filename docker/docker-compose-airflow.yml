version: '3.8'

networks:
  default:
    name: docker_default
    external: true

volumes:
  airflow_postgres_data:
    driver: local

x-airflow-common: &airflow-common
  # Tự động build từ Dockerfile.airflow đã tối ưu hoặc tái sử dụng custom image
  build:
    context: ..
    dockerfile: docker/Dockerfile.airflow
  image: ecom-airflow-spark:2.7.3
  environment:
    - AIRFLOW__CORE__EXECUTOR=LocalExecutor
    - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${AIRFLOW_POSTGRES_USER:-airflow}:${AIRFLOW_POSTGRES_PASSWORD:-airflow}@airflow_postgres:5432/${AIRFLOW_POSTGRES_DB:-airflow}
    - AIRFLOW__CORE__LOAD_EXAMPLES=false
    - AIRFLOW__CORE__LOAD_DEFAULT_CONNECTIONS=false
    - AIRFLOW__CORE__DEFAULT_TIMEZONE=Asia/Ho_Chi_Minh
    - AIRFLOW__WEBSERVER__DEFAULT_UI_TIMEZONE=Asia/Ho_Chi_Minh
    - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=false
    - AIRFLOW_UID=${AIRFLOW_UID:-1000}
    - PYTHONPATH=/opt/airflow/ecom_project:/opt/airflow/dags
  volumes:
    - ../dags:/opt/airflow/dags
    - ../logs:/opt/airflow/logs
    - ../:/opt/airflow/ecom_project
  depends_on:
    airflow_postgres:
      condition: service_healthy

services:
  airflow_postgres:
    image: postgres:15-alpine
    container_name: airflow_postgres
    environment:
      - POSTGRES_USER=${AIRFLOW_POSTGRES_USER:-airflow}
      - POSTGRES_PASSWORD=${AIRFLOW_POSTGRES_PASSWORD:-airflow}
      - POSTGRES_DB=${AIRFLOW_POSTGRES_DB:-airflow}
    ports:
      - "${AIRFLOW_POSTGRES_PORT:-5433}:5432"
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${AIRFLOW_POSTGRES_USER:-airflow}"]
      interval: 5s
      retries: 5
    restart: always

  airflow_init:
    <<: *airflow-common
    container_name: airflow_init
    command: >
      bash -c "
      airflow db migrate &&
      airflow users create --username admin --password admin --firstname Data --lastname Engineer --role Admin --email admin@example.com || true &&
      python /opt/airflow/ecom_project/scripts/init_airflow_connections.py || true
      "
    restart: on-failure

  airflow_webserver:
    <<: *airflow-common
    container_name: airflow_webserver
    command: webserver
    ports:
      - "${AIRFLOW_WEBSERVER_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 10s
      timeout: 10s
      retries: 5
    restart: always
    depends_on:
      airflow_init:
        condition: service_completed_successfully

  airflow_scheduler:
    <<: *airflow-common
    container_name: airflow_scheduler
    command: scheduler
    restart: always
    depends_on:
      airflow_init:
        condition: service_completed_successfully
