version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ecom_postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_DWH_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_DWH_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_DWH_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DWH_DB:-ecom_dwh}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - default

networks:
  default:
    name: docker_default
    external: true

volumes:
  postgres_data:
