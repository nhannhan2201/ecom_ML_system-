version: '3.8'

# ==============================================================================
# HẠ TẦNG APACHE KAFKA & ZOOKEEPER & KAFKA UI
# Dự án: E-Commerce Real-Time Purchase Propensity Prediction System
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. ZOOKEEPER: Quản lý metadata, trạng thái và điều phối cụm Kafka
  # ----------------------------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: ecom_zookeeper
    restart: unless-stopped
    ports:
      - "${ZOOKEEPER_PORT:-2181}:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log

  # ----------------------------------------------------------------------------
  # 2. APACHE KAFKA BROKER: Message Broker lưu trữ và phân phối event stream
  # ----------------------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: ecom_kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "${KAFKA_HOST_PORT:-9092}:9092"    # Port mở ra máy Host để script Python kết nối (localhost:9092)
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      # Định nghĩa 2 listener:
      # - PLAINTEXT_HOST (cổng 9092): Dành cho code chạy trực tiếp trên máy host (Python script)
      # - PLAINTEXT (cổng 29092): Dành cho các container khác trong mạng Docker (Flink, Kafka UI)
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka_data:/var/lib/kafka/data

  # ----------------------------------------------------------------------------
  # 3. KAFKA UI: Giao diện Web trực quan để quan sát Topic, Partition và Message
  # ----------------------------------------------------------------------------
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: ecom_kafka_ui
    restart: unless-stopped
    depends_on:
      - kafka
    ports:
      - "${KAFKA_UI_PORT:-8085}:8080"    # Mở Web UI tại http://localhost:8085
    environment:
      KAFKA_CLUSTERS_0_NAME: "ecom-cluster"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:29092"
      KAFKA_CLUSTERS_0_ZOOKEEPER: "zookeeper:2181"

volumes:
  zookeeper_data:
  zookeeper_log:
  kafka_data:
